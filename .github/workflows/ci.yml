name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Validate Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        
      - name: Verify Core Files Existence
        run: |
          if [ ! -f index.html ]; then echo "❌ index.html not found!"; exit 1; fi
          if [ ! -f style.css ]; then echo "❌ style.css not found!"; exit 1; fi
          if [ ! -f script.js ]; then echo "❌ script.js not found!"; exit 1; fi
          echo "✅ All core files are present!"
          
      - name: Validate HTML Structure
        run: |
          grep -i "<html" index.html > /dev/null || (echo "❌ Missing HTML tag" && exit 1)
          grep -i "<body" index.html > /dev/null || (echo "❌ Missing BODY tag" && exit 1)
          echo "✅ HTML structure looks good!"

      - name: Validate GSAP Import
        run: |
          grep -i "gsap.min.js" index.html > /dev/null || (echo "❌ Missing GSAP library" && exit 1)
          echo "✅ GSAP is correctly imported for UI animations."

      - name: CI Validation Success
        run: echo "🚀 CI Pipeline passed! Ready for deployment."

  notify-slack:
    name: Slack Notification
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack Deployment Alert
        run: |
          STATUS="${{ job.status }}"
          COLOR="#22C55E" # Green for success
          if [ "$STATUS" != "success" ]; then
            COLOR="#EF4444" # Red for failure
          fi
          
          PAYLOAD=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$COLOR",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "🚀 DevOps Deployment Alert",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Project:*\nStudent Assignment Portal"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Status:*\n$STATUS"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Code passed CI validation and is deploying to Netlify ✨"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )
          
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
